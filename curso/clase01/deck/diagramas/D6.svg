    <circle cx="1066" cy="180" r="6"/>
    <circle cx="1100" cy="180" r="6"/>
    <circle cx="1134" cy="180" r="6"/>
  </g>
  <g stroke="#15171C" stroke-width="2" marker-end="url(#ar)">
    <line x1="656" y1="192" x2="656" y2="240"/>
    <line x1="688" y1="192" x2="688" y2="240"/>
    <line x1="724" y1="192" x2="724" y2="240"/>
    <line x1="758" y1="192" x2="758" y2="240"/>
    <line x1="792" y1="192" x2="792" y2="240"/>
    <line x1="824" y1="192" x2="824" y2="240"/>
    <line x1="862" y1="192" x2="862" y2="240"/>
    <line x1="894" y1="192" x2="894" y2="240"/>
    <line x1="930" y1="192" x2="930" y2="240"/>
    <line x1="964" y1="192" x2="964" y2="240"/>
    <line x1="1000" y1="192" x2="1000" y2="240"/>
    <line x1="1032" y1="192" x2="1032" y2="240"/>
    <line x1="1066" y1="192" x2="1066" y2="240"/>
    <line x1="1100" y1="192" x2="1100" y2="240"/>
    <line x1="1134" y1="192" x2="1134" y2="240"/>
  </g>
  <rect x="644" y="240" width="500" height="50" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="894" y="271" text-anchor="middle" font-size="22" fill="#15171C">Procesador continuo con estado</text>
  <text x="636" y="336" font-size="22" font-weight="700" fill="#15171C">Latencia: segundos</text>
  <text x="636" y="370" font-size="22" fill="#15171C">Maneja: orden, eventos tardíos, estado</text>

  <!-- Banda inferior -->
  <rect x="24" y="440" width="1152" height="64" fill="#F0EEE7"/>
  <rect x="24" y="440" width="6" height="64" fill="#5F6672"/>
  <text x="46" y="480" font-size="22" fill="#15171C">Streaming se justificaría para despacho o tarifa dinámica; no para comparar 2024 consigo mismo.</text>
</svg>
