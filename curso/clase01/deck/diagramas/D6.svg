    <text x="226" y="188">M</text>
    <rect x="248" y="162" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
    <text x="266" y="188">J</text>
    <rect x="288" y="162" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
    <text x="306" y="188">J</text>
    <rect x="328" y="162" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
    <text x="346" y="188">A</text>
    <rect x="368" y="162" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
    <text x="386" y="188">S</text>
    <rect x="408" y="162" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
    <text x="426" y="188">O</text>
    <rect x="448" y="162" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
    <text x="466" y="188">N</text>
    <rect x="488" y="162" width="36" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
    <text x="506" y="188">D</text>
  </g>

  <line x1="146" y1="200" x2="146" y2="246" stroke="#15171C" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M66,262 V334 A80,12 0 0 0 226,334 V262 Z" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <ellipse cx="146" cy="262" rx="80" ry="12" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="250" y="300" font-size="22" fill="#15171C">Glue: una corrida por lote</text>
  <text x="250" y="336" font-size="22" font-weight="700" fill="#15171C">Latencia: horas o días</text>

  <!-- Panel Streaming -->
  <rect x="612" y="56" width="564" height="344" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
  <text x="636" y="98" font-size="26" font-weight="700" fill="#15171C">Streaming</text>
  <line x1="636" y1="180" x2="1152" y2="180" stroke="#5F6672" stroke-width="2"/>
  <!-- Quince eventos, separados entre 32 y 38 px -->
  <g fill="#15171C">
    <circle cx="656" cy="180" r="6"/>
    <circle cx="688" cy="180" r="6"/>
    <circle cx="724" cy="180" r="6"/>
    <circle cx="758" cy="180" r="6"/>
    <circle cx="792" cy="180" r="6"/>
    <circle cx="824" cy="180" r="6"/>
    <circle cx="862" cy="180" r="6"/>
