<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>Batch procesa doce archivos mensuales por lotes; streaming procesa eventos continuos con latencia de segundos. Este caso es batch.</title>
  <defs>
    <marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#15171C"/>
    </marker>
  </defs>

  <!-- Panel Batch (resaltado) -->
  <rect x="24" y="56" width="564" height="344" rx="6" fill="#F0EEE7" stroke="#2340D8" stroke-width="4"/>
  <text x="48" y="98" font-size="26" font-weight="700" fill="#15171C">Batch</text>
  <rect x="432" y="72" width="140" height="32" rx="16" fill="#2340D8"/>
  <text x="502" y="96" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Este caso</text>

  <line x1="48" y1="180" x2="524" y2="180" stroke="#5F6672" stroke-width="2"/>
