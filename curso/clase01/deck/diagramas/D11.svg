<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
  <defs>
    <clipPath id="cbTop"><rect x="24" y="16" width="1152" height="64" rx="6"/></clipPath>
    <clipPath id="cbBot"><rect x="24" y="440" width="1152" height="64" rx="6"/></clipPath>
  </defs>

  <!-- Banda superior: la consulta -->
  <rect x="24" y="16" width="1152" height="64" rx="6" fill="#F0EEE7"/>
  <rect x="24" y="16" width="6" height="64" fill="#2340D8" clip-path="url(#cbTop)"/>
  <text x="54" y="40" font-family="Menlo, Consolas, monospace" font-size="22" fill="#15171C">SELECT PULocationID, AVG(tips) FROM viajes GROUP BY PULocationID</text>
  <text x="54" y="66" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#15171C">— usa 2 de las 24 columnas.</text>

  <!-- Panel izquierdo: por filas -->
  <rect x="24" y="96" width="564" height="330" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#15171C">
    <text x="48" y="130" font-size="26" font-weight="700">Por filas</text>
    <text x="110" y="162" text-anchor="middle" font-weight="700">PU</text>
    <text x="166" y="162" text-anchor="middle">DO</text>
    <text x="222" y="162" text-anchor="middle">mi</text>
    <text x="278" y="162" text-anchor="middle" font-weight="700">tips</text>
    <text x="334" y="162" text-anchor="middle" fill="#5F6672">…</text>
    <text x="390" y="162" text-anchor="middle" fill="#5F6672">…</text>
    <text x="446" y="162" text-anchor="middle" fill="#5F6672">…</text>
    <text x="502" y="162" text-anchor="middle" fill="#5F6672">…</text>
  </g>
