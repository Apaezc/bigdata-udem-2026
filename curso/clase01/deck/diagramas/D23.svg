<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#15171C">
  <title>D23 · Warehouse, lake más warehouse y lakehouse</title>
  <desc>Tres arquitecturas con las mismas fuentes; el curso usa lake más warehouse con dos copias de gold.</desc>
  <defs>
    <marker id="tk" viewBox="0 0 14 14" refX="14" refY="7" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L14,7 L0,14 Z" fill="#15171C"/>
    </marker>
  </defs>

  <!-- Panel 1 · Warehouse -->
  <rect x="24" y="24" width="372" height="230" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
  <text x="40" y="64" font-size="22" font-weight="700">Warehouse</text>
  <rect x="52" y="82" width="96" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="100" y="108" text-anchor="middle" font-size="22">Parquet</text>
  <rect x="162" y="82" width="96" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="210" y="108" text-anchor="middle" font-size="22">CSV</text>
  <rect x="272" y="82" width="96" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="320" y="108" text-anchor="middle" font-size="22">JSON</text>
  <line x1="210" y1="118" x2="210" y2="146" stroke="#15171C" stroke-width="3" marker-end="url(#tk)"/>
  <rect x="45" y="146" width="330" height="32" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="210" y="167" text-anchor="middle" font-size="22">ETL</text>
  <line x1="210" y1="178" x2="210" y2="210" stroke="#15171C" stroke-width="3" marker-end="url(#tk)"/>
  <rect x="45" y="210" width="330" height="32" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="210" y="231" text-anchor="middle" font-size="22">Tablas</text>

  <!-- Panel 2 · Lake + warehouse (este curso) -->
  <rect x="414" y="24" width="372" height="230" rx="6" fill="#F0EEE7" stroke="#2340D8" stroke-width="4"/>
  <text x="430" y="64" font-size="22" font-weight="700">Lake + warehouse</text>
  <rect x="633" y="40" width="137" height="32" rx="16" fill="#2340D8"/>
  <text x="701.5" y="64" text-anchor="middle" font-size="22" font-weight="700" fill="#FFFFFF">Este curso</text>
  <rect x="442" y="82" width="96" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="490" y="108" text-anchor="middle" font-size="22">Parquet</text>
  <rect x="552" y="82" width="96" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="600" y="108" text-anchor="middle" font-size="22">CSV</text>
  <rect x="662" y="82" width="96" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="710" y="108" text-anchor="middle" font-size="22">JSON</text>
  <line x1="600" y1="118" x2="600" y2="146" stroke="#15171C" stroke-width="3" marker-end="url(#tk)"/>
  <rect x="435" y="146" width="330" height="32" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="600" y="167" text-anchor="middle" font-size="22">S3 bronze/silver/gold</text>
  <line x1="600" y1="178" x2="600" y2="210" stroke="#15171C" stroke-width="3" marker-end="url(#tk)"/>
  <text x="612" y="202" font-size="22" font-weight="700" fill="#2340D8">COPY INTO</text>
  <rect x="435" y="210" width="330" height="32" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="600" y="231" text-anchor="middle" font-size="22">Tablas Snowflake</text>

  <!-- Panel 3 · Lakehouse -->
  <rect x="804" y="24" width="372" height="230" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
  <text x="820" y="64" font-size="22" font-weight="700">Lakehouse</text>
  <rect x="832" y="82" width="96" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="880" y="108" text-anchor="middle" font-size="22">Parquet</text>
  <rect x="942" y="82" width="96" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="990" y="108" text-anchor="middle" font-size="22">CSV</text>
  <rect x="1052" y="82" width="96" height="36" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="1100" y="108" text-anchor="middle" font-size="22">JSON</text>
  <line x1="990" y1="118" x2="990" y2="146" stroke="#15171C" stroke-width="3" marker-end="url(#tk)"/>
  <rect x="825" y="146" width="330" height="32" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="990" y="167" text-anchor="middle" font-size="22">S3 + tabla abierta (Iceberg)</text>
  <line x1="990" y1="178" x2="990" y2="210" stroke="#15171C" stroke-width="3" marker-end="url(#tk)"/>
  <rect x="825" y="210" width="330" height="32" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <text x="990" y="231" text-anchor="middle" font-size="22">Motores</text>

  <!-- Filas de comparación -->
  <text x="24" y="290" font-size="22" font-weight="700">Esquema</text>
  <text x="204" y="290" font-size="22">antes de guardar</text>
  <text x="600" y="290" text-anchor="middle" font-size="22">al leer y antes de servir</text>
  <text x="990" y="290" text-anchor="middle" font-size="22">en la tabla</text>
  <line x1="24" y1="298" x2="1176" y2="298" stroke="#D9D6CC" stroke-width="2"/>

  <text x="24" y="322" font-size="22" font-weight="700">ACID</text>
  <text x="204" y="322" font-size="22">en el warehouse</text>
  <text x="600" y="322" text-anchor="middle" font-size="22">solo en Snowflake</text>
  <text x="990" y="322" text-anchor="middle" font-size="22">en el formato de tabla</text>
  <line x1="24" y1="330" x2="1176" y2="330" stroke="#D9D6CC" stroke-width="2"/>

  <text x="24" y="354" font-size="22" font-weight="700">Copias de gold</text>
  <text x="204" y="354" font-size="22">1</text>
  <text x="600" y="354" text-anchor="middle" font-size="22">2: S3 y Snowflake</text>
  <text x="990" y="354" text-anchor="middle" font-size="22">1</text>

  <!-- Callout propio: transacciones en Snowflake -->
  <rect x="24" y="372" width="1152" height="48" rx="6" fill="#F0EEE7"/>
  <rect x="24" y="372" width="6" height="48" rx="3" fill="#2340D8"/>
  <text x="46" y="404" font-size="22">Snowflake es transaccional: DELETE + COPY INTO pueden ir en BEGIN…COMMIT</text>

  <!-- Banda por qué aquí (gris) -->
  <rect x="24" y="440" width="1152" height="64" rx="6" fill="#F0EEE7"/>
  <rect x="24" y="440" width="6" height="64" rx="3" fill="#5F6672"/>
  <text x="46" y="466" font-size="22">Por qué aquí: en S3 escribe un solo job por mes y nadie consulta S3 directamente;</text>
  <text x="46" y="492" font-size="22">separar niveles obliga a justificar dónde vive cada dato.</text>
</svg>
