<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>Quince de 24 columnas se usan; el JSON anidado del clima debe aplanarse a una fila por día.</title>
  <desc>Izquierda: 24 columnas de FHVHV en cuadrícula, 15 usadas (oscuras) y 9 sin uso (grises). Derecha: el JSON anidado de daily se aplana a una fila por día con lluvia_mm.</desc>

  <defs>
    <marker id="d13-ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#15171C"/>
    </marker>
    <marker id="d13-ah-acc" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="14" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2340D8"/>
    </marker>
    <clipPath id="d13-band"><rect x="24" y="440" width="1152" height="64" rx="6"/></clipPath>
  </defs>

  <!-- Izquierda: cuadrícula de 24 columnas -->
  <text x="24" y="60" font-size="26" font-weight="700" fill="#15171C">15 de 24 columnas usadas</text>
  <rect x="24" y="80" width="22" height="22" rx="6" fill="#15171C"/>
  <text x="56" y="98" font-size="22" fill="#15171C">usadas</text>
  <rect x="180" y="80" width="22" height="22" rx="6" fill="#D9D6CC"/>
  <text x="212" y="98" font-size="22" fill="#15171C">hoy sin uso</text>

  <!-- Fila 1: 8 usadas; fila 2: 7 usadas y 1 sin uso; fila 3: 8 sin uso -->
  <g fill="#15171C">
    <rect x="24"  y="136" width="52" height="40" rx="6"/>
    <rect x="92"  y="136" width="52" height="40" rx="6"/>
    <rect x="160" y="136" width="52" height="40" rx="6"/>
    <rect x="228" y="136" width="52" height="40" rx="6"/>
    <rect x="296" y="136" width="52" height="40" rx="6"/>
    <rect x="364" y="136" width="52" height="40" rx="6"/>
    <rect x="432" y="136" width="52" height="40" rx="6"/>
    <rect x="500" y="136" width="52" height="40" rx="6"/>
    <rect x="24"  y="188" width="52" height="40" rx="6"/>
    <rect x="92"  y="188" width="52" height="40" rx="6"/>
    <rect x="160" y="188" width="52" height="40" rx="6"/>
    <rect x="228" y="188" width="52" height="40" rx="6"/>
    <rect x="296" y="188" width="52" height="40" rx="6"/>
    <rect x="364" y="188" width="52" height="40" rx="6"/>
    <rect x="432" y="188" width="52" height="40" rx="6"/>
  </g>
  <g fill="#D9D6CC">
    <rect x="500" y="188" width="52" height="40" rx="6"/>
    <rect x="24"  y="240" width="52" height="40" rx="6"/>
    <rect x="92"  y="240" width="52" height="40" rx="6"/>
    <rect x="160" y="240" width="52" height="40" rx="6"/>
    <rect x="228" y="240" width="52" height="40" rx="6"/>
    <rect x="296" y="240" width="52" height="40" rx="6"/>
    <rect x="364" y="240" width="52" height="40" rx="6"/>
    <rect x="432" y="240" width="52" height="40" rx="6"/>
    <rect x="500" y="240" width="52" height="40" rx="6"/>
  </g>

  <!-- Pastilla de decisión -->
  <rect x="24" y="312" width="528" height="72" rx="16" fill="#2340D8"/>
  <g font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <text x="288" y="342">¿Guardar las 9 restantes, con costo,</text>
    <text x="288" y="370">o descartarlas, sin reprocesar?</text>
  </g>

  <!-- Derecha: JSON anidado -->
  <rect x="620" y="96" width="556" height="112" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
  <g font-family="Menlo, Consolas, monospace" font-size="22" fill="#15171C">
    <text x="644" y="132">{"daily": {</text>
    <text x="668" y="160">"time": [...],</text>
    <text x="668" y="188">"precipitation_sum": [...]}}</text>
  </g>

  <!-- Flecha de aplanado (acento) -->
  <line x1="700" y1="208" x2="700" y2="276" stroke="#2340D8" stroke-width="4" marker-end="url(#d13-ah-acc)"/>
  <text x="716" y="246" font-size="22" font-weight="700" fill="#15171C">aplanar: una fila por día</text>

  <!-- Mini-tabla fecha · lluvia_mm -->
  <rect x="620" y="278" width="380" height="144" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="2"/>
  <g stroke="#D9D6CC" stroke-width="2">
    <line x1="620" y1="314" x2="1000" y2="314"/>
    <line x1="620" y1="350" x2="1000" y2="350"/>
    <line x1="620" y1="386" x2="1000" y2="386"/>
    <line x1="810" y1="278" x2="810" y2="422"/>
  </g>
  <text x="636" y="302" font-size="22" font-weight="700" fill="#15171C">fecha</text>
  <text x="826" y="302" font-size="22" font-weight="700" fill="#15171C">lluvia_mm</text>
  <g font-family="Menlo, Consolas, monospace" font-size="22" fill="#15171C">
    <text x="636" y="338">2024-01-01</text>
    <text x="826" y="338">0.0</text>
    <text x="636" y="374">2024-01-02</text>
    <text x="826" y="374">0.0</text>
    <text x="636" y="410">2024-01-24</text>
    <text x="826" y="410">3.5</text>
  </g>

  <!-- Banda inferior -->
  <rect x="24" y="440" width="1152" height="64" rx="6" fill="#F0EEE7"/>
  <rect x="24" y="440" width="6" height="64" fill="#5F6672" clip-path="url(#d13-band)"/>
  <text x="50" y="480" font-size="22" fill="#15171C">O decides antes qué guardar, o pagas por conservar lo que quizá nunca uses.</text>
</svg>
