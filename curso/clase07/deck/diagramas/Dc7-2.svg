<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" font-family="Helvetica Neue, Arial, sans-serif">
<title>Qué da la casa y qué escribe el equipo en cada paso</title><desc>Cuatro columnas, una por paso. En cada una, arriba la caja de la casa con las funciones ya hechas y abajo la caja del equipo con lo que escribe: agregar_metadatos en bronze, deduplicar en silver, la tabla de gold propia en gold y el CREATE TABLE propio en snowflake. Abajo, una nota: agregar_metadatos y deduplicar hoy no hacen nada a propósito; debe_ingestar y registrar_ingesta ya vienen resueltas.</desc>
