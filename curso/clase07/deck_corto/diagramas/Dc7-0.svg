<rect x="676" y="140" width="200" height="110" rx="6" fill="#B07F0E" stroke="#B07F0E" stroke-width="1.5"/>
<text x="776.0" y="176.0" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">Gold</text>
<text x="776.0" y="203.0" font-size="22" fill="#FFFFFF" text-anchor="middle">correr_gold</text>
<text x="776.0" y="230.0" font-size="22" fill="#FFFFFF" text-anchor="middle">resume el negocio</text>
<line x1="776" y1="138" x2="776" y2="54" stroke="#2340D8" stroke-width="2.5" marker-end="url(#m_a)" marker-start="url(#m_a)"/>
