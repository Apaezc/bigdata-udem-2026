<text x="536.0" y="230.0" font-size="22" fill="#FFFFFF" text-anchor="middle">limpia y espeja</text>
<line x1="536" y1="138" x2="536" y2="54" stroke="#2340D8" stroke-width="2.5" marker-end="url(#m_a)" marker-start="url(#m_a)"/>
