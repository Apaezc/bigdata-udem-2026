<text x="81.0" y="176.0" font-size="22" fill="#15171C" text-anchor="middle" font-weight="700">Fuentes</text>
<text x="81.0" y="203.0" font-size="22" fill="#5F6672" text-anchor="middle">viajes</text>
<text x="81.0" y="230.0" font-size="22" fill="#5F6672" text-anchor="middle">zonas, clima</text>
<line x1="158" y1="195" x2="194" y2="195" stroke="#5F6672" stroke-width="2.5" marker-end="url(#m_g)"/>
<rect x="196" y="140" width="200" height="110" rx="6" fill="#B4622F" stroke="#B4622F" stroke-width="1.5"/>
<text x="296.0" y="176.0" font-size="22" fill="#FFFFFF" text-anchor="middle" font-weight="700">Bronze</text>
