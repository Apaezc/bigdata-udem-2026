<text x="296.0" y="230.0" font-size="22" fill="#FFFFFF" text-anchor="middle">guarda tal cual</text>
<line x1="296" y1="138" x2="296" y2="54" stroke="#2340D8" stroke-width="2.5" marker-end="url(#m_a)" marker-start="url(#m_a)"/>
<line x1="398" y1="195" x2="434" y2="195" stroke="#5F6672" stroke-width="2.5" marker-end="url(#m_g)"/>
<rect x="436" y="140" width="200" height="110" rx="6" fill="#6E7F94" stroke="#6E7F94" stroke-width="1.5"/>
