<text x="6" y="24" font-size="22" fill="#2340D8" text-anchor="start">pregunta antes</text>
<text x="6" y="52" font-size="22" fill="#2340D8" text-anchor="start">y anota al final</text>
<text x="560" y="300" font-size="22" fill="#15171C" text-anchor="middle" font-weight="700">La misma función corre en un notebook, con make correr</text>
<text x="560" y="330" font-size="22" fill="#15171C" text-anchor="middle" font-weight="700">y como tarea del DAG pipeline_taxi (con el mismo nombre).</text>
<text x="560" y="384" font-size="22" fill="#5F6672" text-anchor="middle">Para pasar de Spark en el Code Editor a Glue cambia solo el cómputo.</text>
