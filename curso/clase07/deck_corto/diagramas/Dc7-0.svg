<text x="1016.0" y="203.0" font-size="22" fill="#5F6672" text-anchor="middle">cargar_snowflake</text>
<text x="1016.0" y="230.0" font-size="22" fill="#5F6672" text-anchor="middle">carga la tabla</text>
