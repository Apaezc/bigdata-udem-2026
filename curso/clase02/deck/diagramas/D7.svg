<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Helvetica Neue', Arial, sans-serif">
<title>Línea de tiempo de un warehouse: se reanuda con una consulta, factura hasta suspenderse y cada arranque cobra al menos 60 segundos.</title>
<defs>
<marker id="ar" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#15171C"/></marker>
<marker id="arA" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#2340D8"/></marker>
<marker id="arG" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" refX="14" refY="7" orient="auto"><path d="M0,0 L14,7 L0,14 Z" fill="#5F6672"/></marker>
</defs>
<rect x="24" y="16" width="1152" height="64" rx="0" fill="#F0EEE7"/>
<rect x="24" y="16" width="6" height="64" fill="#2340D8"/>
<text x="46" y="56" font-size="22" fill="#15171C">Se factura el tiempo encendido, por segundo, con un mínimo de 60 s en cada arranque.</text>
<text x="24" y="142" font-size="22" font-weight="700" fill="#15171C">Estado</text>
<text x="24" y="202" font-size="22" font-weight="700" fill="#15171C">Consultas</text>
<text x="24" y="270" font-size="22" font-weight="700" fill="#15171C">Facturado</text>
<line x1="330" y1="108" x2="330" y2="300" stroke="#5F6672" stroke-width="1.5"/>
<line x1="760" y1="108" x2="760" y2="300" stroke="#5F6672" stroke-width="1.5"/>
<text x="336" y="102" font-size="20" fill="#15171C">llega una consulta: AUTO_RESUME</text>
<text x="766" y="102" font-size="20" fill="#15171C">se suspende</text>
<rect x="200" y="112" width="130" height="44" rx="0" fill="#5F6672" opacity="0.35"/>
<text x="265" y="141" font-size="20" fill="#15171C" text-anchor="middle">suspendido</text>
<rect x="330" y="112" width="430" height="44" rx="0" fill="#2340D8"/>
<text x="545" y="142" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">encendido</text>
<rect x="760" y="112" width="416" height="44" rx="0" fill="#5F6672" opacity="0.35"/>
<text x="968" y="141" font-size="20" fill="#15171C" text-anchor="middle">suspendido</text>
<rect x="345" y="178" width="50" height="30" rx="0" fill="#15171C"/>
<rect x="520" y="178" width="40" height="30" rx="0" fill="#15171C"/>
<text x="342" y="230" font-size="20" fill="#5F6672">consulta</text>
<text x="540" y="230" font-size="20" fill="#5F6672" text-anchor="middle">consulta</text>
<path d="M560,200 v8 H760 v-8" fill="none" stroke="#15171C" stroke-width="2"/>
<text x="772" y="208" font-size="20" fill="#15171C">60 s sin consultas: AUTO_SUSPEND</text>
<rect x="330" y="240" width="430" height="44" rx="0" fill="#2340D8" fill-opacity="0.35" stroke="#2340D8" stroke-width="4"/>
<text x="772" y="258" font-size="22" fill="#15171C">créditos por segundo</text>
<text x="772" y="282" font-size="22" fill="#15171C">mientras está encendido</text>
<path d="M330,292 v8 H390 v-8" fill="none" stroke="#15171C" stroke-width="2"/>
<text x="340" y="322" font-size="20" fill="#15171C">mínimo 60 s</text>
<rect x="24" y="332" width="370" height="90" rx="10" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<text x="209" y="370" font-size="26" font-weight="700" fill="#15171C" text-anchor="middle">0.0167 créditos</text>
<text x="209" y="402" font-size="20" fill="#5F6672" text-anchor="middle">un arranque mínimo, X-Small</text>
<rect x="414" y="332" width="370" height="90" rx="10" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<text x="599" y="370" font-size="26" font-weight="700" fill="#15171C" text-anchor="middle">0.0667 créditos</text>
<text x="599" y="402" font-size="20" fill="#5F6672" text-anchor="middle">un arranque mínimo, Medium</text>
<rect x="804" y="332" width="370" height="90" rx="10" fill="#F0EEE7" stroke="#2340D8" stroke-width="4"/>
<text x="989" y="370" font-size="26" font-weight="700" fill="#2340D8" text-anchor="middle">0.0207 créditos</text>
<text x="989" y="402" font-size="20" fill="#5F6672" text-anchor="middle">19 consultas, 74.6 s, X-Small</text>
<rect x="24" y="440" width="1152" height="64" rx="0" fill="#F0EEE7"/>
<rect x="24" y="440" width="6" height="64" fill="#5F6672"/>
<text x="46" y="468" font-size="22" fill="#15171C">Costo = talla × tiempo encendido, no consultas</text>
<text x="46" y="494" font-size="22" fill="#15171C">ejecutadas. Apagar rápido reduce el tiempo ocioso.</text>
</svg>
