<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="'Helvetica Neue', Arial, sans-serif">
<title>Ocho micro-particiones con su rango de fechas: el filtro de un mes descarta siete y lee una; en SF1000 leyó 134 de 10 336.</title>
