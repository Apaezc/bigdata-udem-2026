<text x="536" y="306" font-size="22" font-weight="700" fill="#2340D8">se lee</text>
<text x="600" y="404" font-size="26" font-weight="700" text-anchor="middle" fill="#15171C"><tspan fill="#2340D8">134 de 10 336 micro-particiones</tspan><tspan font-size="22" font-weight="400" fill="#5F6672">  ·  </tspan><tspan>19.2 GB → 0.25 GB</tspan><tspan font-size="22" font-weight="400" fill="#5F6672">  ·  </tspan><tspan>6.0 s → 2.0 s</tspan></text>
<text x="600" y="428" font-size="20" fill="#5F6672" text-anchor="middle">SF1000, X-Small, un mes de L_SHIPDATE; sin filtro, media de cuatro ejecuciones</text>
<rect x="24" y="440" width="1152" height="64" rx="0" fill="#F0EEE7"/>
<rect x="24" y="440" width="6" height="64" fill="#5F6672"/>
<text x="46" y="468" font-size="22" fill="#15171C">Límite: omite solo si la columna está agrupada. Profundidad media: 1.41 en L_SHIPDATE;</text>
<text x="46" y="494" font-size="22" fill="#15171C">10 336 en L_QUANTITY (todas se solapan). Rangos del diagrama: ilustrativos.</text>
