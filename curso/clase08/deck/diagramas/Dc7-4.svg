<rect x="954" y="64" width="148" height="84" rx="6" fill="#FFFFFF" stroke="#15171C" stroke-width="3"/>
<text x="1028.0" y="100.5" font-size="22" fill="#15171C" text-anchor="middle" font-weight="700">DAG en la</text>
<text x="1028.0" y="127.5" font-size="22" fill="#5F6672" text-anchor="middle">VM (prod)</text>
<line x1="633" y1="66" x2="633" y2="432" stroke="#B3261E" stroke-width="2.5" stroke-dasharray="8 6"/>
<text x="621" y="36" font-size="22" fill="#15171C" text-anchor="end" font-weight="700">dev: todo desde el Code Editor</text>
<text x="645" y="36" font-size="22" fill="#B3261E" text-anchor="start" font-weight="700">prod: solo por PR y CI/CD</text>
