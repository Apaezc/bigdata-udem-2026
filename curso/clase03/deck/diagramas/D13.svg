<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Helvetica Neue, Arial, sans-serif">
<title>El JOIN que duplica</title>
<desc>Un pedido de 100 con tres líneas suma 300 después del JOIN; en SF1, 1.5 M de pedidos pasan a 6.0 M de filas y la suma se multiplica por 5.</desc>
<rect x="24" y="16" width="6" height="64" fill="#2340D8"/>
<text x="44" y="55" font-size="22" fill="#15171C">Un pedido (uno) tiene varias líneas (muchos): al unir, el pedido se repite por cada línea.</text>
<rect x="24" y="104" width="360" height="72" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<rect x="24" y="104" width="360" height="36" rx="6" fill="#D9D6CC" stroke="#5F6672" stroke-width="2"/>
<text x="36" y="129" font-size="20" fill="#15171C" font-weight="700">ORDERS</text>
<line x1="24" y1="140" x2="384" y2="140" stroke="#5F6672" stroke-width="1.5"/>
<text x="36" y="165" font-size="22" fill="#15171C">pedido A · O_TOTALPRICE 100</text>
<rect x="424" y="104" width="180" height="144" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<rect x="424" y="104" width="180" height="36" rx="6" fill="#D9D6CC" stroke="#5F6672" stroke-width="2"/>
<text x="436" y="129" font-size="20" fill="#15171C" font-weight="700">LINEITEM</text>
<line x1="424" y1="140" x2="604" y2="140" stroke="#5F6672" stroke-width="1.5"/>
<text x="436" y="165" font-size="22" fill="#15171C">A-1</text>
<line x1="424" y1="176" x2="604" y2="176" stroke="#5F6672" stroke-width="1.5"/>
<text x="436" y="201" font-size="22" fill="#15171C">A-2</text>
<line x1="424" y1="212" x2="604" y2="212" stroke="#5F6672" stroke-width="1.5"/>
<text x="436" y="237" font-size="22" fill="#15171C">A-3</text>
<polyline points="624.0,176.0 781.0,176.0" fill="none" stroke="#2340D8" stroke-width="4" stroke-linejoin="round"/>
<polygon points="796.0,176.0 780.0,184.0 780.0,168.0" fill="#2340D8"/>
<text x="710" y="162" font-size="22" fill="#2340D8" font-weight="700" text-anchor="middle">JOIN</text>
<rect x="800" y="104" width="376" height="144" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<rect x="800" y="104" width="376" height="36" rx="6" fill="#D9D6CC" stroke="#5F6672" stroke-width="2"/>
<text x="812" y="129" font-size="20" fill="#15171C" font-weight="700">Resultado del JOIN</text>
<line x1="800" y1="140" x2="1176" y2="140" stroke="#5F6672" stroke-width="1.5"/>
<text x="812" y="165" font-size="22" fill="#15171C"><tspan>A-1 · </tspan><tspan fill="#2340D8" font-weight="700">100</tspan></text>
<line x1="800" y1="176" x2="1176" y2="176" stroke="#5F6672" stroke-width="1.5"/>
<text x="812" y="201" font-size="22" fill="#15171C"><tspan>A-2 · </tspan><tspan fill="#2340D8" font-weight="700">100</tspan></text>
<line x1="800" y1="212" x2="1176" y2="212" stroke="#5F6672" stroke-width="1.5"/>
<text x="812" y="237" font-size="22" fill="#15171C"><tspan>A-3 · </tspan><tspan fill="#2340D8" font-weight="700">100</tspan></text>
<text x="1176" y="282" font-size="22" fill="#15171C" font-weight="700" text-anchor="end">SUM(O_TOTALPRICE) = 300; el pedido vale 100</text>
<rect x="24" y="310" width="560" height="110" rx="10" fill="#F0EEE7" stroke="#2340D8" stroke-width="4"/>
<text x="44" y="358" font-size="26" fill="#2340D8" font-weight="700">1 500 000 → 6 001 215</text>
<text x="44" y="396" font-size="20" fill="#5F6672">filas: pedidos contra filas tras el JOIN (× 4.0)</text>
<rect x="616" y="310" width="560" height="110" rx="10" fill="#F0EEE7" stroke="#2340D8" stroke-width="4"/>
<text x="636" y="358" font-size="26" fill="#2340D8" font-weight="700">226.8 → 1 134.4 mil millones</text>
<text x="636" y="396" font-size="20" fill="#5F6672">SUM(O_TOTALPRICE) sin JOIN contra con JOIN (× 5.0)</text>
<rect x="24" y="440" width="6" height="64" fill="#5F6672"/>
<text x="44" y="467" font-size="22" fill="#15171C">El monto crece más que las filas porque los pedidos grandes tienen más líneas</text>
<text x="44" y="493" font-size="22" fill="#15171C">y se repiten más.</text>
</svg>
