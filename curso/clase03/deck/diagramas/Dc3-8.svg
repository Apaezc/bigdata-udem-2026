<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Helvetica Neue, Arial, sans-serif">
<title>Estrella de NYC y las tres fuentes que la alimentan</title>
<desc>Tabla de hechos FACT_VIAJES_DIA con DIM_FECHA (clima), DIM_ZONA y DIM_EMPRESA, y los tres orígenes que la alimentan.</desc>
<defs><marker id="m_acento" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2340D8"/></marker><marker id="m_gris" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#5F6672"/></marker><marker id="m_ink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#15171C"/></marker></defs>
<text x="30" y="40" font-size="20" fill="#5F6672">Propuesta de diseño; el gold actual (tabla final del pipeline) repite LLUVIA_MM en cada fila</text>
<rect x="370" y="72" width="460" height="230" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<text x="388" y="133.8" font-size="24" fill="#15171C" font-weight="700">FACT_VIAJES_DIA</text>
<text x="388" y="170.0" font-size="20" fill="#15171C">Grano: fecha × zona × empresa</text>
<text x="388" y="201.0" font-size="20" fill="#15171C">Medidas: VIAJES, INGRESO_TOTAL y las</text>
<text x="388" y="226.0" font-size="20" fill="#15171C">sumas con las que se rehacen los promedios</text>
<text x="388" y="257.0" font-size="20" fill="#15171C">15 909 filas en enero 2024</text>
<rect x="30" y="72" width="290" height="230" rx="6" fill="#FBFAF6" stroke="#2340D8" stroke-width="3"/>
<text x="42" y="110.2" font-size="22" fill="#2340D8" font-weight="700">DIM_FECHA</text>
<text x="42" y="141.8" font-size="20" fill="#15171C">FECHA, LLUVIA_MM,</text>
<text x="42" y="166.8" font-size="20" fill="#15171C">TEMP_MEDIA_C,</text>
<text x="42" y="191.8" font-size="20" fill="#15171C">DIA_SEMANA</text>
<text x="42" y="228.8" font-size="20" fill="#2340D8" font-weight="700">LLUVIA_MM: un valor por</text>
<text x="42" y="253.8" font-size="20" fill="#2340D8" font-weight="700">día (31 en enero), no</text>
<text x="42" y="278.8" font-size="20" fill="#2340D8" font-weight="700">511-515 filas por día</text>
<rect x="880" y="72" width="290" height="230" rx="6" fill="#FBFAF6" stroke="#5F6672" stroke-width="2"/>
<text x="892" y="150.7" font-size="22" fill="#15171C" font-weight="700">DIM_ZONA</text>
<text x="892" y="182.2" font-size="20" fill="#15171C">LOCATION_ID, BOROUGH,</text>
<text x="892" y="207.2" font-size="20" fill="#15171C">ZONE, SERVICE_ZONE</text>
<text x="892" y="238.2" font-size="20" fill="#5F6672">261 zonas en el gold</text>
<line x1="320" y1="187" x2="370" y2="187" stroke="#5F6672" stroke-width="2"/>
<line x1="830" y1="187" x2="880" y2="187" stroke="#5F6672" stroke-width="2"/>
<rect x="560" y="326" width="240" height="76" rx="6" fill="#FBFAF6" stroke="#5F6672" stroke-width="2"/>
<text x="680.0" y="357.6" font-size="22" fill="#15171C" font-weight="700" text-anchor="middle">DIM_EMPRESA</text>
<text x="680.0" y="385.2" font-size="20" fill="#15171C" text-anchor="middle">Uber, Lyft</text>
<line x1="680" y1="302" x2="680" y2="326" stroke="#5F6672" stroke-width="2"/>
<rect x="30" y="428" width="300" height="76" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<text x="180.0" y="459.0" font-size="20" fill="#15171C" font-weight="700" text-anchor="middle">Clima (JSON Open-Meteo)</text>
<text x="180.0" y="486.0" font-size="20" fill="#15171C" text-anchor="middle">→ DIM_FECHA</text>
<rect x="350" y="428" width="190" height="76" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<text x="445.0" y="459.0" font-size="20" fill="#15171C" font-weight="700" text-anchor="middle">Viajes (Parquet)</text>
<text x="445.0" y="486.0" font-size="20" fill="#15171C" text-anchor="middle">→ hechos</text>
<rect x="940" y="428" width="230" height="76" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<text x="1055.0" y="459.0" font-size="20" fill="#15171C" font-weight="700" text-anchor="middle">Zonas (CSV)</text>
<text x="1055.0" y="486.0" font-size="20" fill="#15171C" text-anchor="middle">→ DIM_ZONA</text>
<line x1="165" y1="426" x2="165" y2="306" stroke="#5F6672" stroke-width="2" marker-end="url(#m_gris)"/>
<line x1="445" y1="426" x2="445" y2="306" stroke="#5F6672" stroke-width="2" marker-end="url(#m_gris)"/>
<line x1="1055" y1="426" x2="1055" y2="266" stroke="#5F6672" stroke-width="2" marker-end="url(#m_gris)"/>
</svg>
