<text x="34" y="217.8" font-size="20" fill="#15171C">C_NAME,</text>
<text x="34" y="242.8" font-size="20" fill="#15171C">C_MKTSEGMENT,</text>
<text x="34" y="267.8" font-size="20" fill="#15171C">N_NAME, R_NAME</text>
<rect x="970" y="110" width="206" height="190" rx="6" fill="#FBFAF6" stroke="#5F6672" stroke-width="2"/>
<text x="982" y="169.7" font-size="22" fill="#15171C" font-weight="700">DIM_FECHA</text>
<text x="982" y="199.2" font-size="20" fill="#5F6672">2 406 filas</text>
<text x="982" y="230.2" font-size="20" fill="#15171C">FECHA, ANIO,</text>
<text x="982" y="255.2" font-size="20" fill="#15171C">MES</text>
