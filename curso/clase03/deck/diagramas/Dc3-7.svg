<text x="980" y="340" font-size="20" fill="#2340D8" font-weight="700">6 039 653.63</text>
<text x="60" y="392" font-size="22" fill="#15171C" font-weight="700">ASIA pierde 6 039 653.63 y EUROPE lo gana; ningún pedido cambió</text>
<text x="60" y="428" font-size="18" fill="#5F6672">Ingreso = suma de L_EXTENDEDPRICE × (1 − L_DISCOUNT), sin impuesto; O_TOTALPRICE (6 273 788.41) sí lo incluye.</text>
<text x="60" y="458" font-size="18" fill="#5F6672">Mudanza supuesta; pedidos reales de TPC-H SF1. Valores en unidades monetarias de TPC-H.</text>
