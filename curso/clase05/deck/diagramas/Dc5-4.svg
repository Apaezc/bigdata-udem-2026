<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" font-family="Helvetica Neue, Arial, sans-serif">
<title>Join normal frente a broadcast</title><desc>Izquierda: los viajes de cada ejecutor cruzan al otro para encontrarse con su zona. Derecha: la tabla de zonas se copia a cada ejecutor y los viajes no se mueven.</desc>
<defs><marker id="m_a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2340D8"/></marker><marker id="m_g" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#5F6672"/></marker><marker id="m_b" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#B4622F"/></marker></defs>
<text x="40" y="34" font-size="22" fill="#15171C" text-anchor="start" font-weight="700">Join normal: se mueven los viajes</text>
<text x="560" y="34" font-size="22" fill="#B4622F" text-anchor="end" font-weight="700">8.27 s</text>
<rect x="40" y="60" width="240" height="160" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="1.5"/>
<text x="160" y="88" font-size="19" fill="#15171C" text-anchor="middle" font-weight="700">ejecutor A</text>
<rect x="56" y="102" width="208" height="44" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="1.5"/>
<text x="160" y="131" font-size="17" fill="#15171C" text-anchor="middle">viajes de todas las zonas</text>
<rect x="56" y="156" width="208" height="44" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="1.5"/>
<text x="160" y="185" font-size="17" fill="#15171C" text-anchor="middle">parte de las zonas</text>
<rect x="320" y="60" width="240" height="160" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="1.5"/>
<text x="440" y="88" font-size="19" fill="#15171C" text-anchor="middle" font-weight="700">ejecutor B</text>
<rect x="336" y="102" width="208" height="44" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="1.5"/>
<text x="440" y="131" font-size="17" fill="#15171C" text-anchor="middle">viajes de todas las zonas</text>
<rect x="336" y="156" width="208" height="44" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="1.5"/>
<text x="440" y="185" font-size="17" fill="#15171C" text-anchor="middle">parte de las zonas</text>
<line x1="282" y1="112" x2="318" y2="112" stroke="#B4622F" stroke-width="4" marker-end="url(#m_b)"/>
<line x1="318" y1="132" x2="282" y2="132" stroke="#B4622F" stroke-width="4" marker-end="url(#m_b)"/>
<text x="300" y="98" font-size="15" fill="#B4622F" text-anchor="middle" font-weight="700">shuffle</text>
<rect x="40" y="240" width="520" height="92" rx="6" fill="#F6E9E0" stroke="none"/>
<text x="56" y="272" font-size="19" fill="#15171C" text-anchor="start">Cada viaje viaja al ejecutor que tiene su zona:</text>
<text x="56" y="300" font-size="19" fill="#15171C" text-anchor="start">se reparten por la red millones de filas</text>
<text x="56" y="322" font-size="19" fill="#15171C" text-anchor="start">para encontrar el nombre de 265 zonas.</text>
<text x="640" y="34" font-size="22" fill="#15171C" text-anchor="start" font-weight="700">Broadcast: se copia la tabla pequeña</text>
<text x="1160" y="34" font-size="22" fill="#2340D8" text-anchor="end" font-weight="700">2.96 s</text>
<rect x="820" y="52" width="160" height="44" rx="6" fill="#E3E6F6" stroke="#2340D8" stroke-width="2"/>
<text x="900" y="81" font-size="17" fill="#2340D8" text-anchor="middle" font-weight="700">zonas · 265 filas</text>
<line x1="900" y1="98" x2="760" y2="128" stroke="#2340D8" stroke-width="2.5" marker-end="url(#m_a)"/>
<rect x="640" y="130" width="240" height="160" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="1.5"/>
<text x="760" y="158" font-size="19" fill="#15171C" text-anchor="middle" font-weight="700">ejecutor A</text>
<rect x="656" y="172" width="208" height="44" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="1.5"/>
<text x="760" y="201" font-size="17" fill="#15171C" text-anchor="middle">sus viajes, quietos</text>
<rect x="656" y="226" width="208" height="44" rx="6" fill="#E3E6F6" stroke="#2340D8" stroke-width="1.5"/>
<text x="760" y="255" font-size="17" fill="#2340D8" text-anchor="middle">copia de las zonas</text>
<line x1="900" y1="98" x2="1040" y2="128" stroke="#2340D8" stroke-width="2.5" marker-end="url(#m_a)"/>
<rect x="920" y="130" width="240" height="160" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="1.5"/>
<text x="1040" y="158" font-size="19" fill="#15171C" text-anchor="middle" font-weight="700">ejecutor B</text>
<rect x="936" y="172" width="208" height="44" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="1.5"/>
<text x="1040" y="201" font-size="17" fill="#15171C" text-anchor="middle">sus viajes, quietos</text>
<rect x="936" y="226" width="208" height="44" rx="6" fill="#E3E6F6" stroke="#2340D8" stroke-width="1.5"/>
<text x="1040" y="255" font-size="17" fill="#2340D8" text-anchor="middle">copia de las zonas</text>
<text x="900" y="322" font-size="19" fill="#5F6672" text-anchor="middle">cada ejecutor une localmente</text>
<rect x="40" y="360" width="1120" height="110" rx="6" fill="#F0EEE7" stroke="none"/>
<text x="60" y="396" font-size="21" fill="#15171C" text-anchor="start">Como fotocopiar el directorio de zonas para cada oficina, en vez de mandar</text>
<text x="60" y="424" font-size="21" fill="#15171C" text-anchor="start">a cada viajero a la oficina que tiene su zona.</text>
<text x="60" y="454" font-size="18" fill="#5F6672" text-anchor="start">Spark lo hace solo si la tabla pequeña mide menos de 10 MB; debe caber en cada ejecutor.</text>
</svg>
