<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Helvetica Neue, Arial, sans-serif">
<title>Arquitectura del clúster y el Code Editor en miniatura</title>
<desc>A la izquierda, un driver que reparte tareas a tres ejecutores, cada uno en su máquina con sus particiones. A la derecha, el Code Editor: una máquina con un proceso y dos hilos.</desc>
<defs><marker id="m_acento" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2340D8"/></marker><marker id="m_gris" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#5F6672"/></marker><marker id="m_ink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#15171C"/></marker></defs>
<text x="40" y="34" font-size="22" fill="#15171C" font-weight="700">Un clúster de Spark</text>
<rect x="120" y="52" width="560" height="92" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="2"/>
<text x="140" y="84" font-size="24" fill="#15171C" font-weight="700">Driver</text>
<text x="140" y="118" font-size="20" fill="#15171C">lee tu código, arma el plan y reparte el trabajo</text>
<rect x="40" y="186" width="230" height="194" rx="6" fill="none" stroke="#5F6672" stroke-width="2" stroke-dasharray="8 6"/>
<text x="56" y="212" font-size="20" fill="#5F6672">una máquina</text>
<rect x="50" y="224" width="210" height="144" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="1.5"/>
<text x="60" y="254" font-size="22" fill="#15171C" font-weight="700">Ejecutor</text>
<text x="60" y="280" font-size="20" fill="#15171C">hace las tareas</text>
<text x="60" y="304" font-size="20" fill="#15171C">sobre sus particiones</text>
<rect x="80" y="322" width="150" height="34" rx="4" fill="#FBFAF6" stroke="#5F6672" stroke-width="1.5"/>
<text x="155" y="345" font-size="20" fill="#15171C" text-anchor="middle">partición</text>
<rect x="285" y="186" width="230" height="194" rx="6" fill="none" stroke="#5F6672" stroke-width="2" stroke-dasharray="8 6"/>
<text x="301" y="212" font-size="20" fill="#5F6672">una máquina</text>
<rect x="295" y="224" width="210" height="144" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="1.5"/>
<text x="305" y="254" font-size="22" fill="#15171C" font-weight="700">Ejecutor</text>
<text x="305" y="280" font-size="20" fill="#15171C">hace las tareas</text>
<text x="305" y="304" font-size="20" fill="#15171C">sobre sus particiones</text>
<rect x="325" y="322" width="150" height="34" rx="4" fill="#FBFAF6" stroke="#5F6672" stroke-width="1.5"/>
<text x="400" y="345" font-size="20" fill="#15171C" text-anchor="middle">partición</text>
<rect x="530" y="186" width="230" height="194" rx="6" fill="none" stroke="#5F6672" stroke-width="2" stroke-dasharray="8 6"/>
<text x="546" y="212" font-size="20" fill="#5F6672">una máquina</text>
<rect x="540" y="224" width="210" height="144" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="1.5"/>
<text x="550" y="254" font-size="22" fill="#15171C" font-weight="700">Ejecutor</text>
<text x="550" y="280" font-size="20" fill="#15171C">hace las tareas</text>
<text x="550" y="304" font-size="20" fill="#15171C">sobre sus particiones</text>
<rect x="570" y="322" width="150" height="34" rx="4" fill="#FBFAF6" stroke="#5F6672" stroke-width="1.5"/>
<text x="645" y="345" font-size="20" fill="#15171C" text-anchor="middle">partición</text>
<line x1="125" y1="144" x2="125" y2="186" stroke="#2340D8" stroke-width="2.5" marker-end="url(#m_acento)"/>
<line x1="185" y1="186" x2="185" y2="144" stroke="#5F6672" stroke-width="1.5" marker-end="url(#m_gris)"/>
<line x1="370" y1="144" x2="370" y2="186" stroke="#2340D8" stroke-width="2.5" marker-end="url(#m_acento)"/>
<line x1="430" y1="186" x2="430" y2="144" stroke="#5F6672" stroke-width="1.5" marker-end="url(#m_gris)"/>
<line x1="615" y1="144" x2="615" y2="186" stroke="#2340D8" stroke-width="2.5" marker-end="url(#m_acento)"/>
<line x1="675" y1="186" x2="675" y2="144" stroke="#5F6672" stroke-width="1.5" marker-end="url(#m_gris)"/>
<text x="358" y="172" font-size="20" fill="#2340D8" text-anchor="end">tareas</text>
<text x="442" y="172" font-size="20" fill="#5F6672">resultados</text>
<text x="40" y="418" font-size="20" fill="#15171C"><tspan font-weight="700">Clúster:</tspan> varias máquinas que trabajan juntas.</text>
<text x="40" y="446" font-size="20" fill="#15171C"><tspan font-weight="700">Tarea:</tspan> el trabajo de un hilo del ejecutor sobre una partición.</text>
<text x="800" y="34" font-size="22" fill="#15171C" font-weight="700">Tu Code Editor</text>
<text x="800" y="62" font-size="20" fill="#5F6672">el editor en la nube donde trabajas</text>
<rect x="800" y="84" width="360" height="360" rx="6" fill="#F0EEE7" stroke="#2340D8" stroke-width="3"/>
<text x="818" y="116" font-size="20" fill="#15171C">1 máquina · 2 vCPU · 7.6 GB</text>
<rect x="818" y="130" width="324" height="74" rx="6" fill="#FBFAF6" stroke="#5F6672" stroke-width="1.5"/>
<text x="834" y="160" font-size="20" fill="#15171C" font-weight="700">Driver y ejecutor</text>
<text x="834" y="188" font-size="20" fill="#15171C">1 proceso Java · 2 GB</text>
<rect x="818" y="228" width="156" height="56" rx="6" fill="#FBFAF6" stroke="#5F6672" stroke-width="1.5"/>
<rect x="986" y="228" width="156" height="56" rx="6" fill="#FBFAF6" stroke="#5F6672" stroke-width="1.5"/>
<text x="896" y="262" font-size="20" fill="#15171C" text-anchor="middle">hilo 1</text>
<text x="1064" y="262" font-size="20" fill="#15171C" text-anchor="middle">hilo 2</text>
<text x="980" y="312" font-size="20" fill="#5F6672" text-anchor="middle">cada hilo corre una tarea</text>
<text x="818" y="344" font-size="20" fill="#15171C">hilo: una línea de ejecución</text>
<text x="818" y="370" font-size="20" fill="#15171C">de la máquina</text>
<text x="818" y="400" font-size="20" fill="#15171C"><tspan font-family="JetBrains Mono, SF Mono, Menlo, Consolas, Courier New, monospace">defaultParallelism</tspan> = 2</text>
<text x="818" y="426" font-size="20" fill="#15171C">· modo local[*]</text>
<rect x="40" y="466" width="1120" height="42" rx="6" fill="#F0EEE7" stroke="none"/>
<text x="56" y="494" font-size="22" fill="#15171C">Mismo código y mismo plan: solo cambia dónde vive el ejecutor.</text>
</svg>
