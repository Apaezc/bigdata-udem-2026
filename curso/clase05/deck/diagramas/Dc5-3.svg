<text x="140" y="180" font-size="20" fill="#15171C" text-anchor="middle">P1</text>
<rect x="360" y="150" width="140" height="44" rx="4" fill="#FBFAF6" stroke="#5F6672" stroke-width="1.5"/>
<text x="430" y="180" font-size="20" fill="#15171C" text-anchor="middle">P1'</text>
