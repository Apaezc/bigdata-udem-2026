<line x1="790" y1="226" x2="940" y2="280" stroke="#2340D8" stroke-width="1.6" marker-end="url(#m_acento)"/>
<line x1="790" y1="280" x2="940" y2="118" stroke="#2340D8" stroke-width="1.6" marker-end="url(#m_acento)"/>
<line x1="790" y1="280" x2="940" y2="172" stroke="#2340D8" stroke-width="1.6" marker-end="url(#m_acento)"/>
<line x1="790" y1="280" x2="940" y2="226" stroke="#2340D8" stroke-width="1.6" marker-end="url(#m_acento)"/>
<line x1="790" y1="280" x2="940" y2="280" stroke="#2340D8" stroke-width="1.6" marker-end="url(#m_acento)"/>
<text x="640" y="330" font-size="20" fill="#15171C">Las filas con la misma zona se juntan:</text>
<text x="640" y="356" font-size="20" fill="#15171C">eso es el shuffle.</text>
<text x="640" y="382" font-size="20" fill="#15171C">Exchange hashpartitioning(PULocationID, 200)</text>
<text x="640" y="408" font-size="20" fill="#15171C">groupBy 3.7 s · 262 zonas</text>
<text x="40" y="448" font-size="20" fill="#15171C"><tspan font-weight="700">Exchange:</tspan> la línea del plan donde las filas cambian de partición.</text>
<text x="40" y="476" font-size="20" fill="#15171C"><tspan font-weight="700">Shuffle:</tspan> mover filas entre particiones; cuesta disco, red y tiempo.</text>
</svg>
