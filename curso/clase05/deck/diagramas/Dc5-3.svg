<text x="430" y="234" font-size="20" fill="#15171C" text-anchor="middle">P2'</text>
<line x1="210" y1="226" x2="360" y2="226" stroke="#5F6672" stroke-width="2" marker-end="url(#m_gris)"/>
<rect x="70" y="258" width="140" height="44" rx="4" fill="#FBFAF6" stroke="#5F6672" stroke-width="1.5"/>
<text x="140" y="288" font-size="20" fill="#15171C" text-anchor="middle">P3</text>
