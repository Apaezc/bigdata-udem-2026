<text x="430" y="288" font-size="20" fill="#15171C" text-anchor="middle">P3'</text>
<line x1="210" y1="280" x2="360" y2="280" stroke="#5F6672" stroke-width="2" marker-end="url(#m_gris)"/>
<text x="60" y="330" font-size="20" fill="#15171C">Cada partición trabaja sola.</text>
<text x="60" y="356" font-size="20" fill="#15171C">4 particiones antes y 4 después · sin Exchange</text>
<rect x="650" y="96" width="140" height="44" rx="4" fill="#FBFAF6" stroke="#5F6672" stroke-width="1.5"/>
<text x="720" y="126" font-size="20" fill="#15171C" text-anchor="middle">P0</text>
