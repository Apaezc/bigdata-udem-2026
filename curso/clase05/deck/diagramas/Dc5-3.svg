<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Helvetica Neue, Arial, sans-serif">
<title>Transformación estrecha frente a ancha, con shuffle</title>
<desc>A la izquierda, cuatro particiones que pasan a cuatro sin cruzarse. A la derecha, las filas de cada partición se cruzan con todas las salidas: es el shuffle.</desc>
<defs><marker id="m_acento" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2340D8"/></marker><marker id="m_gris" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#5F6672"/></marker><marker id="m_ink" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#15171C"/></marker></defs>
<rect x="40" y="36" width="540" height="384" rx="6" fill="#F0EEE7" stroke="none"/>
<rect x="620" y="36" width="540" height="384" rx="6" fill="#F0EEE7" stroke="none"/>
<text x="60" y="62" font-size="22" fill="#15171C" font-weight="700">Estrecha: WHERE, SELECT, withColumn</text>
<text x="640" y="62" font-size="22" fill="#15171C" font-weight="700">Ancha: GROUP BY, JOIN, ORDER BY, DISTINCT</text>
<rect x="70" y="96" width="140" height="44" rx="4" fill="#FBFAF6" stroke="#5F6672" stroke-width="1.5"/>
