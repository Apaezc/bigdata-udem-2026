<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" font-family="Helvetica Neue, Arial, sans-serif">
<title>Dos palancas para leer menos: meses y columnas</title><desc>Cuadrícula de dos por dos. Con una columna, un mes lee 53 MB y doce meses leen 641 MB. Con siete columnas, un mes lee 141 MB y doce meses superan 1 GB: la consulta queda CANCELLED con el mensaje Bytes scanned limit was exceeded. Abajo, el tope del workgroup: 1 GB por consulta.</desc>
