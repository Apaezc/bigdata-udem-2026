<text x="666" y="38" font-size="22" fill="#15171C" text-anchor="start" font-weight="700">S3 · bronze/fhvhv/</text>
<rect x="666" y="56" width="200" height="36" rx="6" fill="#F6E9E0" stroke="#B4622F" stroke-width="3"/>
<text x="766" y="82" font-size="22" fill="#B4622F" text-anchor="middle" font-weight="700" font-family="SF Mono, Menlo, Consolas, monospace">mes=2024-01</text>
