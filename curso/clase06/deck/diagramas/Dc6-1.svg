<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" font-family="Helvetica Neue, Arial, sans-serif">
<title>Athena consulta el lake: catálogo, carpetas por mes y workgroup</title><desc>A la izquierda, una consulta SQL entra a Athena. Athena consulta un catálogo (base bigdata_lake) que dice dónde están los archivos y qué columnas tienen, y lee en S3 solo las carpetas mes= que el filtro pide. Abajo, el workgroup bigdata-wg con su tope de 1 GB leído por consulta.</desc>
<defs><marker id="m_a" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#2340D8"/></marker><marker id="m_g" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#5F6672"/></marker><marker id="m_b" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#B4622F"/></marker><marker id="m_y" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#FFC83D"/></marker></defs>
<rect x="8" y="170" width="312" height="100" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="1.5"/>
<text x="164" y="206" font-size="22" fill="#15171C" text-anchor="middle" font-weight="700">Consulta SQL</text>
<text x="164" y="246" font-size="22" fill="#15171C" text-anchor="middle" font-family="SF Mono, Menlo, Consolas, monospace">WHERE mes = '2024-01'</text>
<line x1="322" y1="220" x2="362" y2="220" stroke="#5F6672" stroke-width="2.5" marker-end="url(#m_g)"/>
<rect x="364" y="170" width="170" height="100" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="1.5"/>
<text x="449.0" y="228.0" font-size="22" fill="#15171C" text-anchor="middle" font-weight="700">Athena</text>
<rect x="316" y="6" width="290" height="112" rx="6" fill="#FFFFFF" stroke="#5F6672" stroke-width="1.5"/>
<text x="461" y="36" font-size="22" fill="#15171C" text-anchor="middle" font-weight="700">Catálogo bigdata_lake</text>
<text x="461" y="66" font-size="22" fill="#15171C" text-anchor="middle">dónde están los archivos</text>
<text x="461" y="93" font-size="22" fill="#15171C" text-anchor="middle">y qué columnas tienen</text>
<line x1="449" y1="168" x2="449" y2="120" stroke="#5F6672" stroke-width="2.5" marker-end="url(#m_g)" marker-start="url(#m_g)"/>
