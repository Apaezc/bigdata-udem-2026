<text x="666" y="346" font-size="22" fill="#5F6672" text-anchor="start">Las otras once carpetas no se abren.</text>
<line x1="536" y1="214" x2="662" y2="78" stroke="#B4622F" stroke-width="3" marker-end="url(#m_b)"/>
<text x="580" y="210" font-size="22" fill="#B4622F" text-anchor="start" font-weight="700">se lee</text>
<text x="8" y="308" font-size="22" fill="#5F6672" text-anchor="start">Una sola columna, pickup_datetime:</text>
<text x="8" y="340" font-size="22" fill="#B4622F" text-anchor="start" font-weight="700">Con filtro de mes lee una carpeta: 53 MB</text>
<text x="8" y="372" font-size="22" fill="#15171C" text-anchor="start" font-weight="700">Sin filtro abre las doce: 641 MB</text>
<rect x="8" y="390" width="1104" height="46" rx="6" fill="#F0EEE7" stroke="#5F6672" stroke-width="1.5"/>
<text x="560" y="421" font-size="22" fill="#15171C" text-anchor="middle" font-weight="700">Workgroup bigdata-wg · tope de 1 GB leído por consulta · resultados en S3</text>
