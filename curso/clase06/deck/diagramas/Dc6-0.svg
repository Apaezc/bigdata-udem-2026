<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" font-family="Helvetica Neue, Arial, sans-serif">
<title>Mapa de la clase 6: de las fuentes a gold, con Athena, el lab y el DAG de Airflow</title><desc>De izquierda a derecha, tres fuentes (viajes, zonas, clima) entran cada una a su tarea de ingesta (ingestar_viajes, ingestar_zonas, ingestar_clima), que escriben bronze; después vienen silver y gold. Un marco que envuelve las cinco tareas es el DAG ingesta_mensual de Airflow; el DAG no carga a Snowflake. Athena mira bronze desde abajo; el lab construye silver y gold. Arriba, la tabla de control en Snowflake, con flechas de consulta y de registro.</desc>
