<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" font-family="Helvetica Neue, Arial, sans-serif">
<title>Mapa de la clase 6: de las fuentes a Snowflake, con Athena, el lab y el DAG de Airflow</title><desc>De izquierda a derecha, tres fuentes (viajes, zonas, clima) llegan a la ingesta, que escribe bronze; Athena mira bronze; el lab construye silver y gold; gold se carga a Snowflake. Un marco que envuelve las cinco tareas es el DAG de Airflow. Arriba, la tabla de control en Snowflake, con flechas de consulta y de registro.</desc>
