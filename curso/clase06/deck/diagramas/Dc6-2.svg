<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 440" font-family="Helvetica Neue, Arial, sans-serif">
<title>DAG ingesta_mensual: cinco tareas en orden</title><desc>Cinco cajas conectadas en fila por flechas: ingestar_zonas, ingestar_clima, ingestar_viajes, silver, gold. Un marco las agrupa con el rótulo ingesta_mensual. Debajo de las tres primeras, la función de ingesta_alumno.py que llaman; debajo de silver y gold, el código del repositorio. Arriba del marco, dos parámetros: mes y reprocesar, y la tabla de control a la que las cinco tareas consultan y registran.</desc>
