<title>Dónde vive cada cosa: S3, el disco del Code Editor y Snowflake</title><desc>Tres zonas. A la izquierda, el bucket de S3 bigdata-lake-&lt;CUENTA&gt;-us-east-2 con el bronze del año (239 470 448 viajes), que Athena lee. En el centro, el disco del Code Editor: ~/datos_clase05/ con bronze_alumno, silver_alumno y gold_alumno, que escribe el DAG ingesta_mensual (viajes 1 000 filas, silver 1 000, gold 281), y ~/datos_clase06/lake_lab, que escribe el lab. A la derecha, el DAG, el lab y la tabla de control de Snowflake BIGDATA.CONTROL.WATERMARK, con flechas punteadas de consulta y registro desde el DAG y el lab.</desc>
