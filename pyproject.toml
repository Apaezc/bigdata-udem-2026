[project]
name = "bigdata-udem-pipeline"
version = "0.1.0"
description = "Pipeline PySpark bronze/silver/gold con NYC TLC yellow trips, taxi zones y clima Open-Meteo"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Los notebooks de clase se escriben para leerse (líneas largas, huecos «...» a propósito): ruff no los revisa.
extend-exclude = ["curso/**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# Generador de slides: plantillas HTML/CSS/JS embebidas y geometría en una línea.
"curso/_deck/*.py" = ["E501", "E741"]
# Diagramas SVG de los decks: etiquetas SVG y textos de las figuras en una línea.
"curso/*/deck/diagramas/*.py" = ["E501"]
# Generadores del guion: notas largas de las slides en una línea.
"curso/*/deck*/generar_guion.py" = ["E501"]
