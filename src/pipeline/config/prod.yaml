# Entorno prod: Glue `medium`/`large` sobre el año completo; lo lanza el Airflow de prod.
# Las rutas NO se escriben aquí: las arma settings.ruta_lake(). En prod todo cuelga de
# s3://<lake>/prod/ (bronze, silver, gold y muestra); prod no toca nada de dev/.
# Para verlas completas: python -c "from pipeline import io; io.donde_estoy('prod')"
entorno: prod
muestra:
  max_rows: null
  # --step muestra (lo corre make muestra): filas aproximadas de la muestra, que se escribe en
  # prod/muestra a partir del bronze del año (prod/bronze).
  objetivo_filas: 100000
meses:
  - "2024-01"
  - "2024-02"
  - "2024-03"
  - "2024-04"
  - "2024-05"
  - "2024-06"
  - "2024-07"
  - "2024-08"
  - "2024-09"
  - "2024-10"
  - "2024-11"
  - "2024-12"
