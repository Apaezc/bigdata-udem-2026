# Entorno local: Spark en el Code Editor sobre la MUESTRA (pocas filas, todos los meses).
# Las rutas NO se escriben aquí: las arma settings.ruta_lake(). Todo queda en ./lake (disco del
# Code Editor): la muestra en ./lake/muestra (es el "bronze" de local), y silver y gold en
# ./lake/silver y ./lake/gold.
# La muestra se copia a ./lake/muestra la primera vez, sola. Primero se busca en tu bucket
# (s3://<lake>/prod/muestra, la genera --step muestra --env prod) y, si ahí no hay una muestra
# con el formato nuevo, se descarga la del bucket público del curso.
entorno: local
muestra:
  # Bucket público del curso (lectura anónima, sin credenciales) con la misma muestra, por si la
  # de tu bucket no existe o es de la versión anterior.
  publica:
    bucket: bigdata-udem-2026-publico
    prefijo: paquete/muestra
    region: us-east-2
  # Recorte adicional de filas de viajes (null = toda la muestra). --limite lo reemplaza.
  max_rows: null
limites:
  # Guardia de Spark local (~2 GB de driver): por encima de esto, usar Glue.
  max_mb_entrada: 500
meses:
  - "2024-01"
